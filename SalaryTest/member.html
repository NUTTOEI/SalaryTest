<!DOCTYPE html>
<html lang="th">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Comsci41">
        <meta name="robots" content="index, follow">
        <meta name="google-site-verification" content="member.html">
        <title>เงินรุ่น Comsci41</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icon.min.css">
        <link rel="stylesheet" href="member.css">
    </head>
    <body>
        <div class="page">
            <div class="brand">
                <div class="eyebrow">ระบบเก็บเงินสาขา</div>
                <div class="title" id="room-title">เงินรวมสาขา</div>
            </div>

            <!-- หน้าเข้าสู่ระบบ / ลงทะเบียน -->
            <div id="student-id-screen" class="card-screen">
                <div class="input-card">
                    <div class="card-icon">
                        <i class="ti ti-id-badge-2"></i>
                    </div>

                    <!-- ปุ่มสลับแท็บ เข้าสู่ระบบ / ลงทะเบียน -->
                    <div class="auth-tabs" style="display: flex; gap: 8px; margin-bottom: 16px;">
                        <button id="tab-login-btn" onclick="switchTab('login')" style="flex: 1; padding: 10px; border-radius: 8px; border: none; background: #5b4a8f; color: white; font-weight: 600; cursor: pointer;">เข้าสู่ระบบ</button>
                        <button id="tab-register-btn" onclick="switchTab('register')" style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #eae4f0; background: #faf7f2; color: #241f2e; font-weight: 600; cursor: pointer;">ลงทะเบียน</button>
                    </div>

                    <!-- ฟอร์มเข้าสู่ระบบ -->
                    <form id="login-form" onsubmit="handleStudentIdSubmit(event)">
                        <h3>เข้าสู่ระบบ</h3>
                        <p>กรุณากรอกรหัสนักศึกษา</p>
                        <div class="form-group">
                            <input
                                type="text"
                                id="student-id-input"
                                placeholder="เช่น 68xxxxxxxx"
                                maxlength="13"
                                required
                            />
                        </div>
                        <div id="id-error-msg" class="error-msg hidden"></div>
                        <button type="submit" class="submit-btn">
                            <span>ตกลง / เข้าสู่ระบบ</span>
                            <i class="ti ti-arrow-right"></i>
                        </button>
                    </form>

                    <!-- ฟอร์มลงทะเบียนสมาชิกใหม่ -->
                    <form id="register-form" onsubmit="handleRegister(event)" style="display: none;">
                        <h3>ลงทะเบียนสมาชิก</h3>
                        <p>กรอกข้อมูลเพื่อสร้างบัญชีเข้าใช้งาน</p>
                        <div class="form-group" style="display: flex; flex-direction: column; gap: 10px;">
                            <input type="text" id="reg-student-id" placeholder="รหัสนักศึกษา" required />
                            <input type="text" id="reg-name" placeholder="ชื่อ - นามสกุล" required />
                            <input type="text" id="reg-branch" placeholder="สาขา / ตัวย่อสาขา (เช่น BWBS)" required />
                        </div>
                        <button type="submit" class="submit-btn" style="background: #28a745; margin-top: 14px;">
                            <span>บันทึกการลงทะเบียน</span>
                            <i class="ti ti-check"></i>
                        </button>
                    </form>
                </div>
            </div>

            <div class="top-menu-container" style="display: block !important;">
                <button id="menu-toggle-btn" class="menu-btn" onclick="toggleTopMenu()" title="เมนู">
                    ☰
                </button>

                <div id="top-dropdown-menu" class="dropdown-menu hidden">
                    <a href="#" onclick="triggerUploadProfile(); return false;"><i class="ti ti-photo"></i> เปลี่ยนโปรไฟล์</a>
                    <a href="#" onclick="logoutStudentId(); return false;"><i class="ti ti-logout"></i> ออกจากระบบ</a>
                </div>
                <input type="file" id="profile-file-input" accept="image/*" style="display: none;">
            </div>

            <div id="home-screen" class="hidden">
                <div class="user-bar">
                    <span id="current-user-info"></span>
                    <button onclick="logoutStudentId()" class="switch-user-btn">
                        <i class="ti ti-logout"></i> เปลี่ยนรหัส
                    </button>
                </div>

                <div class="jar-card summary-card-new">
                    <div class="circle-chart-wrap">
                        <svg class="progress-ring" width="120" height="120" viewBox="0 0 120 120">
                            <circle class="progress-ring-bg" cx="60" cy="60" r="52" stroke="#EFEAF9" stroke-width="10" fill="none" />
                            <circle id="circle-progress" class="progress-ring-fill" cx="60" cy="60" r="52" stroke="#5B4A8F" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="326.72" stroke-dashoffset="326.72" transform="rotate(-90 60 60)" />
                        </svg>
                        <div class="circle-inner-content">
                            <div class="circle-text" id="circle-center-money">฿0</div>
                        </div>
                    </div>

                    <div class="jar-info">
                        <div class="jar-pct-main" id="jar-pct">0%</div>
                        <div class="jar-amount">เก็บได้ <b id="jar-collected">฿0</b> จากเป้า <b id="jar-target">฿0</b></div>
                        <div class="jar-sub" id="jar-sub">จ่ายแล้ว 0 จาก 0 คน</div>
                    </div>
                </div>

                <div class="search-wrap">
                    <i class="ti ti-search"></i>
                    <input id="user-search" placeholder="พิมพ์ชื่อของคุณเพื่อเช็กยอด...">
                </div>

                <div class="list-label" id="list-label">รายชื่อสมาชิกทั้งหมด</div>
                <div id="user-list" class="user-list"></div>
            </div>

            <div id="profile-screen" class="hidden">
                <button class="back-btn" id="back-btn"><i class="ti ti-arrow-left"></i>กลับไปหน้ารายชื่อ</button>
                <div class="profile-head">
                    <div class="profile-avatar" id="profile-avatar"></div>
                    <div class="profile-name" id="profile-name"></div>
                    <div class="profile-status" id="profile-status"></div>
                </div>

                <div class="balance-card">
                    <div class="balance-label" id="balance-label"></div>
                    <div class="balance-amount" id="balance-amount"></div>
                    <a href="pay.html" class="pay-btn" id="pay-link">
                        <i class="ti ti-credit-card"></i> ไปหน้าชำระเงิน
                    </a>
                    <div class="status-note hidden" id="status-note"></div>
                </div>

                <div id="member-due-grid"></div>

                <div class="history-card">
                    <div class="history-head">
                        <span>ประวัติการชำระเงิน</span>
                        <span class="total" id="history-total">฿0 สะสม</span>
                    </div>
                    <div id="history-list"></div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="data.js"></script>
        <script src="member.js"></script>
    </body>
</html>
